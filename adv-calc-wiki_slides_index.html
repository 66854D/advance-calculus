<html lang="zh-Hant">
<head>

  <title>Adv-Calc Wiki — 高等微積分知識庫與研究簡報</title>

  <style>
    :root {
      --bg: #FAFAFA;
      --surface: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --border: #E2E8F0;
      --accent: #1D4ED8;
      --accent-soft: #EFF6FF;
      --tag-bg: #F1F5F9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    /* Top Minimal Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }
    .brand span.badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      border: 1px solid #BFDBFE;
    }
    nav.mode-switch {
      display: flex;
      gap: 0.5rem;
    }
    nav.mode-switch button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    nav.mode-switch button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    nav.mode-switch button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    /* Layout for Wiki Browser */
    .workspace {
      display: grid;
      grid-template-columns: 290px 1fr;
      flex: 1;
      max-width: 1360px;
      width: 100%;
      margin: 0 auto;
    }
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.25rem;
      height: calc(100vh - 58px);
      position: sticky;
      top: 58px;
      overflow-y: auto;
    }
    .search-box {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.88rem;
      margin-bottom: 1.2rem;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    .nav-group { margin-bottom: 1.25rem; }
    .nav-group-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.4rem;
      padding-left: 0.4rem;
    }
    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 0.38rem 0.6rem;
      border-radius: 5px;
      font-size: 0.88rem;
      color: var(--text);
      cursor: pointer;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-item:hover { background: var(--tag-bg); }
    .nav-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    /* Main Content Area */
    main.wiki-reader {
      padding: 2.5rem 3.5rem;
      max-width: 880px;
    }
    .article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.2rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .tag {
      background: var(--tag-bg);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .wiki-reader h1 {
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.6rem;
      color: #0F172A;
    }
    .summary-callout {
      background: var(--surface);
      border-left: 3px solid var(--accent);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.2rem;
      border-radius: 0 6px 6px 0;
      margin-bottom: 1.75rem;
      font-size: 0.95rem;
      color: #334155;
    }
    .wiki-body h2 {
      font-size: 1.22rem;
      margin-top: 1.8rem;
      margin-bottom: 0.7rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border);
      color: #0F172A;
    }
    .wiki-body p { margin-bottom: 0.9rem; }
    .wiki-body ul, .wiki-body ol {
      margin-left: 1.4rem;
      margin-bottom: 1rem;
    }
    .wiki-body li { margin-bottom: 0.45rem; }
    .wikilink {
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.05rem 0.35rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 1px solid #93C5FD;
    }
    .wikilink:hover { background: #DBEAFE; }

    /* Overview Grid Cards */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      margin-top: 1.2rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.1rem;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card-cat {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }
    .card-title {
      font-weight: 600;
      font-size: 0.98rem;
      margin-bottom: 0.4rem;
    }
    .card-desc {
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Minimalist Presentation Mode */
    .slides-container {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--bg);
    }
    .slides-container.active { display: flex; }
    .slide-frame {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 100%;
      max-width: 960px;
      min-height: 540px;
      padding: 3.5rem 4.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
      position: relative;
    }
    .slide-kicker {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }
    .slide-frame h2 {
      font-size: 2rem;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 1.5rem;
      line-height: 1.25;
    }
    .slide-frame ul {
      margin-left: 1.3rem;
      font-size: 1.15rem;
      line-height: 1.85;
    }
    .slide-frame li { margin-bottom: 0.75rem; }
    .slide-box {
      background: var(--accent-soft);
      border-left: 4px solid var(--accent);
      padding: 1.1rem 1.4rem;
      margin: 1rem 0;
      border-radius: 0 6px 6px 0;
      font-size: 1.08rem;
    }
    .slide-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 960px;
      margin-top: 1.2rem;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .slide-controls button {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.45rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
    }
    .slide-controls button:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 820px) {
      .workspace { grid-template-columns: 1fr; }
      aside { display: none; }
      main.wiki-reader { padding: 1.5rem; }
      .slide-frame { padding: 2rem; min-height: 420px; }
    }
  </style>
</head>

<script>
const WIKI_DATA = {"dedekind-cut": {"title": "戴德金分割 (Dedekind Cut)", "category": "concepts", "tags": ["#concept", "#real-analysis", "#foundations"], "source": "raw/ch02_實數的建構.md", "summary": "透過將有理數系分割為上下兩個非空集合，精準填補有理數軸上的空隙並嚴格定義實數。", "body": "## 嚴格定義 (Formal Definition)\n將有理數系 $\\mathbb{Q}$ 分割為兩個非空子集 $(A, B)$（即 $A \\cup B = \\mathbb{Q}$ 且 $A \\cap B = \\emptyset$），若滿足：\n1. **下集 $A$ 向下封閉且無最大元素**：對任意 $y \\in \\mathbb{Q}$，若存在 $x \\in A$ 使 $y < x$，則 $y \\in A$；且 $\\forall x \\in A, \\exists z \\in A$ 使 $x < z$。\n2. **上集 $B = \\mathbb{Q} - A$ 向上封閉**：對任意 $x \\in A$ 與 $y \\in B$，恆有 $x < y$。\n\n則稱 $(A, B)$ 為 $\\mathbb{Q}$ 的一個 **Dedekind Cut**，每一個這樣的分割即定義為一個**實數**。\n\n## 直觀理解 (Intuition)\n有理數軸上存在無數看不見的微小縫隙（如 $\\sqrt{2}$）。Dedekind 拿一把刀在有理數軸上切一刀，把所有有理數分成左半部 $A$ 與右半部 $B$：\n- 若右半部 $B$ 有最小元素 $q$，這刀剛好切在有理數 $q$ 上；\n- 若右半部 $B$ 沒有最小元素（如 $A = \\{x \\in \\mathbb{Q} \\mid x < 0 \\text{ 或 } x^2 < 2\\}$），這把刀就精準標定出了一個無理數 $\\sqrt{2}$。\n\n## 相關條目\n- **前置概念**: [[completeness]]\n- **相關定理**: [[nested-interval-theorem]]"}, "completeness": {"title": "實數與賦距空間的完備性 (Completeness)", "category": "concepts", "tags": ["#concept", "#real-analysis", "#metric-space"], "source": "raw/ch02_實數的建構.md, raw/ch06_賦距空間.md", "summary": "填滿空間所有「坑洞」的關鍵性質：實數系中上方有界非空子集必有最小上界；賦距空間中所有 Cauchy 數列必收斂。", "body": "## 嚴格定義 (Formal Definition)\n1. **實數系的完備性（最小上界性質, Least Upper Bound Property）**：\n   設 $S \\subset \\mathbb{R}$ 為非空子集，若 $S$ 上方有界（即 $\\exists K \\in \\mathbb{R}$ 使得 $\\forall x \\in S, x \\le K$），則 $S$ 在 $\\mathbb{R}$ 中必存在**最小上界（上確界）** $\\sup S \\in \\mathbb{R}$。\n2. **賦距空間的完備性 (Complete Metric Space)**：\n   設 $(X, d)$ 為一賦距空間，若 $X$ 中每一個 [[cauchy-sequence]] $\\{x_n\\}$ 都收斂到 $X$ 內的某一點 $x \\in X$（即 $\\lim_{n \\to \\infty} d(x_n, x) = 0$），則稱 $(X, d)$ 為**完備賦距空間**。\n\n## 等價條件與核心性質\n在實數系 $\\mathbb{R}$ 中，以下性質彼此等價（構成微積分「任脈」的基石）：\n- **最小上界性質**（上方有界非空子集必有 $\\sup$）。\n- **單調有界收斂定理**：任何有界遞增數列必收斂。\n- **[[nested-interval-theorem]]**：閉區間套交集恰為單點。\n- **[[bolzano-weierstrass-theorem]]**：$\\mathbb{R}^n$ 中任何有界數列必有收斂子數列。\n- **[[cauchy-criterion]]**：數列收斂 $\\iff$ 為 Cauchy 數列。\n\n在一般賦距空間 $(X, d)$ 中：\n- 任何緊緻賦距空間必完備（[[compactness]] $\\implies$ Complete）。\n- 完備賦距空間必為第二類集（[[baire-category-theorem]]）。\n\n## 相關條目\n- **前置概念**: [[dedekind-cut]], [[cauchy-sequence]]\n- **經典反例**: [[incomplete-rational-space]]"}, "cauchy-sequence": {"title": "柯西數列 (Cauchy Sequence)", "category": "concepts", "tags": ["#concept", "#real-analysis", "#metric-space"], "source": "raw/ch04_極限與連續.md, raw/ch06_賦距空間.md", "summary": "無需預先知道極限點位置，僅透過數列內部元素彼此距離趨近於零來刻畫的收斂趨勢。", "body": "## 嚴格定義 (Formal Definition)\n設 $(X, d)$ 為一賦距空間，數列 $\\{x_n\\} \\subset X$ 稱為 **Cauchy 數列**，若對任意 $\\epsilon > 0$，恆存在自然數 $N \\in \\mathbb{N}$，使得對所有 $m, n > N$：\n$$d(x_m, x_n) < \\epsilon$$\n（等價地，$\\forall n > N, \\forall k \\in \\mathbb{N}, d(x_{n+k}, x_n) < \\epsilon$）。\n\n## 核心性質\n- **收斂必為 Cauchy**：在任何賦距空間中，收斂數列必為 Cauchy 數列，且 Cauchy 數列必有界。\n- **反方向依賴空間完備性**：Cauchy 數列必收斂 $\\iff$ 該賦距空間為 [[completeness]] 空間。\n\n## 相關條目\n- **前置概念**: [[metric-space]]\n- **相關定理**: [[cauchy-criterion]], [[contraction-mapping-theorem]]\n- **經典反例**: [[incomplete-rational-space]]"}, "cardinality": {"title": "基數與可數性 (Cardinality & Countability)", "category": "concepts", "tags": ["#concept", "#set-theory"], "source": "raw/ch03_集合論的公理化.md", "summary": "透過一對一對射函數比較無窮集合的大小階層，區分可數無窮 $\\aleph_0$ 與連續統基數 $c$。", "body": "## 嚴格定義 (Formal Definition)\n- **等勢 / 相同基數 ($A \\sim B$)**：若存在一個從 $A$ 映至 $B$ 的一對一且映成（對射, Bijective）函數 $f: A \\to B$，則稱集合 $A$ 與 $B$ 具有相同的**基數 (Cardinal Number)**，記作 $\\#A = \\#B$。\n- **可數集 (Countable Set)**：若集合 $A$ 為有限集，或與自然數集 $\\mathbb{N}$ 等勢（$A \\sim \\mathbb{N}$），則稱 $A$ 為可數集。無窮可數集的基數記為 $\\aleph_0$（Aleph-zero）。\n- **不可數集 (Uncountable Set)**：非可數的無窮集。實數集 $\\mathbb{R}$ 的基數記為 $c$（連續統基數）。\n\n## 核心基數運算與階層\n- $\\#\\mathbb{N} = \\#\\mathbb{Z} = \\#\\mathbb{Q} = \\#(\\text{代數數集}) = \\aleph_0$\n- $(\\aleph_0)^n = \\aleph_0$（有限個可數集的笛卡兒積仍可數）\n- $2^{\\aleph_0} = (\\aleph_0)^{\\aleph_0} = c^{\\aleph_0} = c$（因此 $\\#\\mathbb{R} = \\#\\mathbb{R}^n = \\#\\mathbb{R}^{\\mathbb{N}} = \\#l^2 = \\#C[0,1] = c$）\n- **Cantor 冪集定理**：對任意集合 $S$，其冪集 $\\mathcal{P}(S)$ 滿足 $\\#\\mathcal{P}(S) > \\#S$，因此 $c < 2^c < 2^{2^c} < \\cdots$ 無窮無盡。\n\n## 相關條目\n- **相關定理**: [[cantor-uncountability-theorem]], [[cdsb-theorem]]\n- **經典反例**: [[cantor-set]]"}, "metric-space": {"title": "賦距空間 (Metric Space)", "category": "concepts", "tags": ["#concept", "#metric-space", "#topology"], "source": "raw/ch06_賦距空間.md", "summary": "將歐氏空間中「距離」抽象化為正定性、對稱性與三角不等式三公理的通用分析舞台。", "body": "## 嚴格定義 (Formal Definition)\n設 $X$ 為一非空集合，若存在函數 $d: X \\times X \\to [0, \\infty)$ 滿足下列三公理：\n1. **正定性**：$d(x, y) \\ge 0$ $\\forall x, y \\in X$，且 $d(x, y) = 0 \\iff x = y$。\n2. **對稱性**：$d(x, y) = d(y, x)$ $\\forall x, y \\in X$。\n3. **三角不等式**：$d(x, y) \\le d(x, z) + d(z, y)$ $\\forall x, y, z \\in X$。\n\n則稱 $d$ 為 $X$ 上的一個**度規 (Metric)**，並稱有序對 $(X, d)$ 為一個**賦距空間 (Metric Space)**。\n\n## 經典空間範例\n- **歐氏空間 $(\\mathbb{R}^n, |\\cdot|)$**：$d(x, y) = \\left(\\sum_{i=1}^n |x_i - y_i|^2\\right)^{1/2}$。\n- **離散賦距空間（孤獨世界）**：$d(x, y) = 1$（若 $x \\neq y$）且 $d(x, x) = 0$。\n- **序列空間 $l^p$ ($p \\ge 1$)**：$l^p = \\{x = (x_i) \\mid \\sum_{i=1}^\\infty |x_i|^p < \\infty\\}$，距離由 $p$-norm 誘導：$d(x, y) = \\|x - y\\|_p$（當 $p=2$ 時為無窮維 Hilbert Space）。\n- **連續函數空間 $C[a, b]$**：配備均勻範數 $d(f, g) = \\|f - g\\|_\\infty = \\max_{a \\le x \\le b} |f(x) - g(x)|$，構成完備的 Banach Space。\n\n## 相關條目\n- **前置概念**: [[completeness]]\n- **相關定理**: [[compact-iff-sequentially-compact]], [[baire-category-theorem]], [[contraction-mapping-theorem]]\n- **經典反例**: [[discrete-metric-space]], [[infinite-dim-closed-unit-ball]]"}, "open-and-closed-sets": {"title": "點集拓樸基礎：開集、閉集、匯聚點與完備集", "category": "concepts", "tags": ["#concept", "#topology", "#metric-space"], "source": "raw/ch05_Rn的Topology.md, raw/ch06_賦距空間.md", "summary": "建立開球、閉集、導集、閉包、邊界與完備集（Perfect Set）的嚴格拓樸刻畫。", "body": "## 嚴格定義 (Formal Definition)\n設 $(X, d)$ 為一賦距空間，$A \\subset X$：\n- **開球 (Open Ball)**：$B_r(x) = \\{y \\in X \\mid d(y, x) < r\\}$；**閉球 (Closed Ball)**：$C_r(x) = \\{y \\in X \\mid d(y, x) \\le r\\}$。\n- **開集 (Open Set)**：對任意 $x \\in V$，恆存在 $r > 0$ 使得 $B_r(x) \\subset V$。\n- **閉集 (Closed Set)**：其補集 $F^c = X - F$ 為開集（等價於 $F$ 包含其所有匯聚點，即 $F' \\subset F$）。\n- **匯聚點 (Limit Point)**：$x \\in X$ 稱為 $A$ 的匯聚點，若 $\\forall r > 0$，$(B_r(x) \\cap A) - \\{x\\} \\neq \\emptyset$。所有匯聚點所成集合記為 $A'$（導集）。\n- **閉包 (Closure)**：$\\overline{A} = A \\cup A'$；**內集 (Interior)**：$A^\\circ$；**邊界 (Boundary)**：$\\partial A = \\overline{A} - A^\\circ$。\n- **完備集 (Perfect Set)**：既閉且無任何孤立點的集合，即 $A = A'$。\n\n## 核心性質\n- 任意多個開集的聯集仍為開集；**有限個**開集的交集仍為開集。\n- 任意多個閉集的交集仍為閉集；**有限個**閉集的聯集仍為閉集。\n- **非空完備集的大小**：$\\mathbb{R}^n$ 中任何非空的 Perfect Set 必定不可數（基數為 $c$），如 [[cantor-set]]。\n\n## 相關條目\n- **前置概念**: [[metric-space]]\n- **相關定理**: [[compactness]], [[connectedness]], [[baire-category-theorem]]"}, "compactness": {"title": "緊緻性與點列緊緻性 (Compactness & Sequential Compactness)", "category": "concepts", "tags": ["#concept", "#topology", "#metric-space"], "source": "raw/ch04_極限與連續.md, raw/ch05_Rn的Topology.md, raw/ch06_賦距空間.md", "summary": "「化無窮為有窮」的核心拓樸性質，讓局部連續性質得以升級為全域均勻性質。", "body": "## 嚴格定義 (Formal Definition)\n設 $(X, d)$ 為一賦距空間，$A \\subset X$：\n1. **開覆蓋緊緻性 (Open Cover Compactness)**：\n   若對於 $A$ 的任意一族開覆蓋 $\\mathcal{F} = \\{V_\\lambda\\}_{\\lambda \\in \\Lambda}$，恆存在**有限個**開集 $V_{\\lambda_1}, \\dots, V_{\\lambda_n} \\in \\mathcal{F}$ 使得 $A \\subset \\bigcup_{i=1}^n V_{\\lambda_i}$，則稱 $A$ 為**緊緻集 (Compact Set)**。\n2. **點列緊緻性 (Sequential Compactness)**：\n   若 $A$ 中任意點列 $\\{x_n\\} \\subset A$ 恆存在收斂子點列 $\\{x_{n_k}\\}$，且其極限點 $x_0 = \\lim_{k \\to \\infty} x_{n_k}$ 仍落在 $A$ 內（$x_0 \\in A$），則稱 $A$ 為**點列緊緻集**。\n\n## 直觀理解 (Intuition)\n陳金次教授名言：**「微 Compact，近代數學其當機矣！」**\n緊緻性的核心威力在於**「化無窮為有窮」**。一旦化為有窮，就能取最大值、最小值，而且最大不會爆到 $\\infty$，最小不會縮到 $0$，讓局部性質得以升級為全域性質。\n\n## 等價條件與核心性質\n- **在歐氏空間 $\\mathbb{R}^n$ 中**：\n  $$\\text{Compact} \\iff \\text{Bounded and Closed} \\iff \\text{Sequentially Compact}$$\n- **在一般賦距空間 $(X, d)$ 中**：\n  $$\\text{Compact} \\iff \\text{Sequentially Compact} \\implies \\text{Bounded and Closed (and Complete)}$$\n- **連續函數保緊緻性**：若 $f: X \\to Y$ 連續且 $A \\subset X$ 緊緻，則 $f(A)$ 緊緻（推廣了最大最小值定理）。\n\n## 相關條目\n- **相關定理**: [[heine-borel-theorem]], [[compact-iff-sequentially-compact]], [[uniform-continuity-theorem]]\n- **經典反例**: [[infinite-dim-closed-unit-ball]]"}, "connectedness": {"title": "連通性與弧連通性 (Connectedness & Path Connectedness)", "category": "concepts", "tags": ["#concept", "#topology", "#metric-space"], "source": "raw/ch06_賦距空間.md, raw/ch07_再談連續函數.md", "summary": "刻畫空間無法被拆解為兩個互不黏連之分離集的拓樸性質，為中間值定理的抽象推廣。", "body": "## 嚴格定義 (Formal Definition)\n設 $(X, d)$ 為一賦距空間：\n- **分離集 (Separated Sets)**：兩個非空子集 $A, B \\subset X$ 稱為分離，若 $\\overline{A} \\cap B = \\emptyset$ 且 $A \\cap \\overline{B} = \\emptyset$。\n- **連通集 (Connected Set)**：子集 $E \\subset X$ 稱為連通集，若 $E$ **無法**寫成兩個分離集的聯集。\n- **遍分離集 (Totally Disconnected Set)**：對任意相異兩點 $x, y \\in E$，皆存在分離集 $A, B$ 使得 $E = A \\cup B$ 且 $x \\in A, y \\in B$（如 $\\mathbb{Q}$、[[cantor-set]]）。\n- **弧連通集 (Path Connected Set)**：對任意兩點 $p, q \\in E$，恆存在連續曲線 $\\phi: [a, b] \\to E$ 使得 $\\phi(a) = p$ 且 $\\phi(b) = q$。\n\n## 核心性質\n- **$\\mathbb{R}$ 中的連通集**：$E \\subset \\mathbb{R}$ 為連通集 $\\iff$ $E$ 為區間。\n- **弧連通與連通的關係**：弧連通 $\\implies$ 連通（反之不成立）；在 $\\mathbb{R}^n$ 中，**開集 + 連通 $\\iff$ 弧連通**。\n- **連續函數保連通性**：若 $f: X \\to Y$ 連續且 $E \\subset X$ 連通，則 $f(E)$ 連通。\n\n## 相關條目\n- **前置概念**: [[open-and-closed-sets]]\n- **經典反例**: [[topologists-sine-curve]]"}, "uniform-continuity": {"title": "均勻連續性 (Uniform Continuity)", "category": "concepts", "tags": ["#concept", "#real-analysis", "#metric-space"], "source": "raw/ch04_極限與連續.md, raw/ch07_再談連續函數.md", "summary": "全域統一尺度的連續性要求 $\\delta(\\epsilon)$ 僅依賴 $\\epsilon$ 而與點的位置無關，保證函數將 Cauchy 數列映至 Cauchy 數列。", "body": "## 嚴格定義 (Formal Definition)\n設 $(X, d)$ 與 $(Y, \\rho)$ 為賦距空間，$A \\subset X$，$f: A \\to Y$ 為一函數。若對任意 $\\epsilon > 0$，恆存在僅與 $\\epsilon$ 有關（與點的位置 $x, x'$ 無關）的 $\\delta = \\delta(\\epsilon) > 0$，使得對所有 $x, x' \\in A$：\n$$d(x, x') < \\delta \\implies \\rho(f(x), f(x')) < \\epsilon$$\n則稱 $f$ 在 $A$ 上**均勻連續（一致連續, Uniformly Continuous）**。\n\n## 判別準則與性質\n1. **緊緻集上的連續函數必均勻連續**（[[uniform-continuity-theorem]]）。\n2. **導數/梯度有界準則**：若 $A \\subset \\mathbb{R}^n$ 為**凸集**，且 $f: A \\to \\mathbb{R}$ 滿足 $\\|\\nabla f(x)\\| \\le M$ $\\forall x \\in A$，則 $f$ 在 $A$ 上均勻連續。\n3. **保 Cauchy 數列**：均勻連續函數將 [[cauchy-sequence]] 映至 Cauchy 數列。\n\n## 相關條目\n- **前置概念**: [[metric-space]], [[compactness]]\n- **相關定理**: [[uniform-continuity-theorem]], [[riemann-integrability-of-continuous-functions]]\n- **經典反例**: [[non-uniform-continuous-functions]]"}, "homeomorphism": {"title": "同胚寫像 (Homeomorphism)", "category": "concepts", "tags": ["#concept", "#topology", "#metric-space"], "source": "raw/ch07_再談連續函數.md", "summary": "雙向連續的一對一映成函數，是拓樸學中判定兩個空間拓樸結構完全等價的「全等」標準。", "body": "## 嚴格定義 (Formal Definition)\n設 $(X, d)$ 與 $(Y, \\rho)$ 為兩個賦距空間，$A \\subset X, B \\subset Y$。若存在一映射 $f: A \\to B$ 滿足：\n1. $f$ 為一對一且映成（Bijective）；\n2. $f$ 在 $A$ 上連續；\n3. 逆映射 $f^{-1}: B \\to A$ 在 $B$ 上亦連續（等價於 $f$ 將 $A$ 中的相對開集映至 $B$ 中的相對開集），\n\n則稱 $f$ 為 $A$ 與 $B$ 之間的**同胚寫像 (Homeomorphism)**，並稱 $A$ 與 $B$ **同胚 (Homeomorphic)**。\n\n## 拓樸不變性\n- 同胚保持開集、閉集、[[compactness]]、[[connectedness]]、可數性與 Perfect Set 性質。\n- **緊緻空間的連續對射自動為同胚**：若 $A$ 為緊緻賦距空間且 $f: A \\to B$ 為連續對射，則 $f^{-1}$ 自動連續。"}, "heine-borel-theorem": {"title": "Heine-Borel 定理 (Heine-Borel Theorem)", "category": "theorems", "tags": ["#theorem", "#topology", "#real-analysis"], "source": "raw/ch04_極限與連續.md, raw/ch05_Rn的Topology.md", "summary": "刻畫歐氏空間 $\\mathbb{R}^n$ 中緊緻集的充要條件：子集為緊緻集若且唯若它是有界閉集。", "body": "## 定理敘述 (Statement)\n**一維形式**：設 $\\mathcal{F}$ 為閉區間 $[a, b]$ 上的一族開覆蓋，則恆可從 $\\mathcal{F}$ 中選出**有限個**開區間覆蓋整個 $[a, b]$。\n**高維推廣 ($\\mathbb{R}^n$)**：子集 $A \\subset \\mathbb{R}^n$ 為 [[compactness]] 集若且唯若 $A$ 為**有界閉集（Bounded and Closed）**。\n\n## 證明核心思路 (Proof Strategy)\n採用**反證法**搭配 **[[nested-interval-theorem]]**（使用 [[nested-ball-argument]]）：假設 $[a, b]$ 無法被有限個開集覆蓋，則不斷將區間二等分，必有一半仍無法被有限覆蓋。依此構造出長度趨近於 $0$ 的閉區間套，交出一點 $x_0 \\in [a, b]$；當 $n$ 夠大時整個小區間 $I_n$ 都會掉進包住 $x_0$ 的單一開集內，產生矛盾。\n\n## 條件必要性分析\n- **「閉集」不可少**：開區間 $(0, 1)$ 有界但不閉，開覆蓋 $\\{(1/n, 1) \\mid n \\ge 2\\}$ 無有限子覆蓋。\n- **「有界」不可少**：全實數 $\\mathbb{R}$ 閉但無界，開覆蓋 $\\{(-n, n) \\mid n \\in \\mathbb{N}\\}$ 無有限子覆蓋。\n- **「歐氏空間 $\\mathbb{R}^n$」不可少**：在無窮維空間 $l^2$ 中，單位閉球有界且閉，卻不緊緻（見 [[infinite-dim-closed-unit-ball]]）。\n\n## 被引用於 (Used In)\n- [[uniform-continuity-theorem]]、[[riemann-integrability-of-continuous-functions]]"}, "compact-iff-sequentially-compact": {"title": "賦距空間緊緻與點列緊緻等價定理", "category": "theorems", "tags": ["#theorem", "#metric-space", "#topology"], "source": "raw/ch06_賦距空間.md", "summary": "在任意賦距空間中，開覆蓋緊緻性與點列緊緻性完全等價，證明關鍵在於 Lebesgue Number 引理。", "body": "## 定理敘述 (Statement)\n設 $(X, d)$ 為任意 [[metric-space]]，$A \\subset X$，則：\n$$A \\text{ 為緊緻集 (Compact)} \\iff A \\text{ 為點列緊緻集 (Sequentially Compact)}$$\n\n## 證明核心思路 (Proof Strategy)\n- **($\\implies$) Compact $\\implies$ Sequentially Compact**：反證法，若無窮點列 $\\{x_n\\}$ 無收斂子列，則每點皆有只含有限個點列元素的小開球；由緊緻性抽出有限覆蓋，導出點列集合為有限集的矛盾。\n- **($\\Longleftarrow$) Sequentially Compact $\\implies$ Compact**：引入 **Lebesgue Number 引理**（利用反證法與「超大集」直徑趨近於 $0$ 逼出收斂子列矛盾），將任意開覆蓋化約為 $\\epsilon$-球有限覆蓋。\n\n## 條件必要性分析\n此等價性高度依賴賦距空間的可度量化性質；在一般拓樸空間中兩者互不蘊含。"}, "baire-category-theorem": {"title": "貝爾綱定理 (Baire's Category Theorem)", "category": "theorems", "tags": ["#theorem", "#metric-space", "#topology", "#real-analysis"], "source": "raw/ch06_賦距空間.md", "summary": "完備賦距空間中，可數個稠密開集的交集仍然稠密；完備空間無法寫成可數個遍稀疏集的聯集。", "body": "## 定理敘述 (Statement)\n設 $(X, d)$ 為一**[[completeness|完備賦距空間]]**：\n1. **稠密開集形式**：若 $\\{O_n\\}_{n=1}^\\infty$ 為 $X$ 中的一列稠密開集，則其可數交集 $\\bigcap_{n=1}^\\infty O_n$ 在 $X$ 中依然稠密。\n2. **第一類集／第二類集形式**：$X$ 無法表為可數個遍稀疏集（Nowhere Dense Sets）的聯集，即完備空間為**第二類集**。\n\n## 證明核心思路 (Proof Strategy)\n使用 **[[nested-ball-argument]]**：給定任意非空開集 $U$，利用 $O_n$ 的稠密性遞迴構造半徑 $r_n < 2^{-n}$ 的閉球套 $\\overline{B_{r_n}(x_n)} \\subset B_{r_{n-1}}(x_{n-1}) \\cap O_n$，由完備性保證球心 Cauchy 數列收斂至同時落在 $U$ 與所有 $O_n$ 的點。\n\n## 條件必要性分析\n- **「完備性」不可少**：[[incomplete-rational-space]] $\\mathbb{Q} = \\bigcup_{q \\in \\mathbb{Q}} \\{q\\}$ 是可數個單點遍稀疏集的聯集。\n\n## 被引用於 (Used In)\n- [[weierstrass-function]]（證明 $C[a,b]$ 中處處不可微的連續函數佔絕大多數）"}, "contraction-mapping-theorem": {"title": "收縮寫像定理 / Banach 固定點定理", "category": "theorems", "tags": ["#theorem", "#metric-space", "#real-analysis"], "source": "raw/ch07_再談連續函數.md", "summary": "完備賦距空間上的嚴格收縮映射必存在唯一固定點，且任意初始點迭代皆以等比速率收斂至該點。", "body": "## 定理敘述 (Statement)\n**假設**：$(X, d)$ 為非空**[[completeness|完備賦距空間]]**，映射 $T: X \\to X$ 滿足存在常數 $0 \\le \\lambda < 1$ 使得：\n$$d(T(x), T(y)) \\le \\lambda d(x, y) \\quad \\forall x, y \\in X$$\n**結論**：$T$ 在 $X$ 中存在**唯一**固定點 $x^* \\in X$（$T(x^*) = x^*$），且任意初始點迭代 $x_{n+1} = T(x_n)$ 皆收斂至 $x^*$。\n\n## 證明核心思路 (Proof Strategy)\n由收縮常數 $\\lambda < 1$ 推得相鄰兩項距離呈等比衰減 $d(x_n, x_{n+1}) \\le \\lambda^n d(x_0, x_1)$，經三角不等式證明 $\\{x_n\\}$ 為 [[cauchy-sequence]]，再由空間完備性取得極限點 $x^*$。\n\n## 條件必要性分析\n- **「$\\lambda < 1$ 常數」不可少**：若僅 $d(T(x), T(y)) < d(x, y)$，固定點未必存在（如 $f(x) = \\frac{1}{2}(x + \\sqrt{x^2 + 4})$）。"}, "cdsb-theorem": {"title": "CDSB 定理 (Cantor-Dedekind-Schröder-Bernstein Theorem)", "category": "theorems", "tags": ["#theorem", "#set-theory"], "source": "raw/ch03_集合論的公理化.md", "summary": "無需使用選擇公理，只要兩集合能互相單射嵌入對方，兩者就必定存在一對一對射（等勢）。", "body": "## 定理敘述 (Statement)\n給定任意兩個集合 $A, B$，若 $A \\sim B^* \\subset B$ 且 $B \\sim A^* \\subset A$，則 $A$ 與 $B$ 具有相同的 [[cardinality]]（$A \\sim B$）。\n\n## 證明核心思路 (Proof Strategy)\n- **Bernstein「剝洋蔥法」**：構造遞降套集 $A_1 \\supset A_2 \\supset \\cdots$，奇數層洋蔥皮用複合單射錯位對應，偶數層與核心 $K = \\bigcap A_n$ 保持恆等映射。\n- **König「溯源法」**：沿逆映射交替追溯祖先，依源頭落點將兩集合各剖分為三部分配對。"}, "cantor-uncountability-theorem": {"title": "實數不可數定理 (Uncountability of Real Numbers)", "category": "theorems", "tags": ["#theorem", "#set-theory", "#real-analysis"], "source": "raw/ch03_集合論的公理化.md", "summary": "利用 Cantor 對角線法證明實數集無法與自然數建立一對一對應，確立不可數無窮的存在。", "body": "## 定理敘述 (Statement)\n開區間 $(0, 1)$ 中的實數集是**不可數的 (Uncountable)**，進而實數集 $\\mathbb{R}$ 與無理數集皆為不可數集。\n\n## 證明核心思路 (Proof Strategy)\n採用 **[[cantor-diagonal-argument]]**：假設 $(0, 1)$ 可列舉為 $\\{x_n\\}$，寫成唯一十進位小數後，沿對角線構造新數 $x = 0.\\beta_1\\beta_2\\cdots$ 使 $\\beta_n \\neq \\alpha_{nn}$，導出 $x$ 不在清單中的矛盾。"}, "nested-interval-theorem": {"title": "區間套與方塊套定理 (Nested Interval & Box Theorem)", "category": "theorems", "tags": ["#theorem", "#real-analysis", "#topology"], "source": "raw/ch02_實數的建構.md, raw/ch05_Rn的Topology.md", "summary": "長度趨近於零的巢狀閉區間（或高維閉方塊）交集必為唯一單點，是實數完備性的幾何化身。", "body": "## 定理敘述 (Statement)\n設 $I_n = [a_n, b_n] \\subset \\mathbb{R}$ 為一列非空閉區間，滿足 $I_1 \\supset I_2 \\supset \\cdots$ 且 $\\lim_{n \\to \\infty} (b_n - a_n) = 0$，則交集 $\\bigcap_{n=1}^\\infty I_n$ 恰含**唯一一點** $x_0 \\in \\mathbb{R}$。\n\n## 條件必要性分析\n- **「閉集」不可少**：開區間套 $(0, 1/n)$ 交集為空集 $\\emptyset$。\n- **「有界」不可少**：無界閉區間套 $[n, \\infty)$ 交集為空集 $\\emptyset$。\n\n## 被引用於 (Used In)\n- [[heine-borel-theorem]]、[[bolzano-weierstrass-theorem]]"}, "bolzano-weierstrass-theorem": {"title": "Bolzano-Weierstrass 定理", "category": "theorems", "tags": ["#theorem", "#real-analysis", "#topology"], "source": "raw/ch02_實數的建構.md, raw/ch04_極限與連續.md, raw/ch05_Rn的Topology.md", "summary": "歐氏空間 $\\mathbb{R}^n$ 中任何有界數列必存在收斂子數列（有限維空間的點列緊緻核心）。", "body": "## 定理敘述 (Statement)\n歐氏空間 $\\mathbb{R}^n$ 中，任何**有界數列 (Bounded Sequence)** $\\{x_n\\}$ 必定存在一個**收斂子數列 (Convergent Subsequence)** $\\{x_{n_k}\\}$。\n\n## 證明核心思路 (Proof Strategy)\n利用 **[[nested-interval-theorem]]** 與 **[[nested-ball-argument]]**：將有界數列包入大閉方塊，反覆二分並挑選含無窮多項的子方塊，收斂至唯一交點。\n\n## 條件必要性分析\n- **「有限維 $\\mathbb{R}^n$」不可少**：在無窮維 $l^2$ 空間中，正交單位基底 $\\{e_n\\}$ 有界但任意兩項距離為 $\\sqrt{2}$，無收斂子列（見 [[infinite-dim-closed-unit-ball]]）。\n\n## 被引用於 (Used In)\n- [[cauchy-criterion]]"}, "cauchy-criterion": {"title": "Cauchy 收斂準則 (Cauchy's Criterion)", "category": "theorems", "tags": ["#theorem", "#real-analysis"], "source": "raw/ch04_極限與連續.md", "summary": "歐氏空間 $\\mathbb{R}^n$ 中數列收斂的充要條件是該數列為 Cauchy 數列。", "body": "## 定理敘述 (Statement)\n在歐氏空間 $\\mathbb{R}^n$ 中，數列 $\\{x_n\\}$ 收斂若且唯若 $\\{x_n\\}$ 為一個 **[[cauchy-sequence]]**。\n\n## 證明核心思路 (Proof Strategy)\n- **($\\implies$)**：三角不等式估計。\n- **($\\Longleftarrow$)**：先證 Cauchy 數列必有界，再由 **[[bolzano-weierstrass-theorem]]** 抽出收斂子數列，進而拉動整個數列收斂。"}, "uniform-continuity-theorem": {"title": "緊緻集上連續函數必均勻連續定理 (Heine-Cantor Theorem)", "category": "theorems", "tags": ["#theorem", "#real-analysis", "#metric-space"], "source": "raw/ch04_極限與連續.md, raw/ch07_再談連續函數.md", "summary": "定義域具備緊緻性時，逐點連續自動升級為全域統一尺度的均勻連續。", "body": "## 定理敘述 (Statement)\n設 $(X, d)$ 與 $(Y, \\rho)$ 為賦距空間，$A \\subset X$ 為 **[[compactness|緊緻集]]**。若函數 $f: A \\to Y$ 在 $A$ 上連續，則 $f$ 在 $A$ 上 **[[uniform-continuity|均勻連續]]**。\n\n## 證明核心思路 (Proof Strategy)\n使用 **[[epsilon-delta-splitting]]** 與有限開覆蓋：對每點 $x \\in A$ 取使變化小於 $\\epsilon/2$ 的半徑 $\\delta_x$，以**半徑減半**的開球族 $\\{B_{\\delta_x / 2}(x)\\}$ 覆蓋 $A$，由緊緻性抽出有限子覆蓋後取最小半徑 $\\delta = \\min\\{\\delta_i / 2\\} > 0$。\n\n## 被引用於 (Used In)\n- [[riemann-integrability-of-continuous-functions]]"}, "riemann-integrability-of-continuous-functions": {"title": "閉區間連續函數的 Riemann 可積性定理", "category": "theorems", "tags": ["#theorem", "#real-analysis", "#integration"], "source": "raw/ch04_極限與連續.md", "summary": "連結均勻連續性與上下和逼近，打通微積分「督脈」證明閉區間連續函數必 Riemann 可積。", "body": "## 定理敘述 (Statement)\n若實函數 $f: [a, b] \\to \\mathbb{R}$ 在閉區間 $[a, b]$ 上連續，則 $f$ 在 $[a, b]$ 上 **Riemann 可積分**。\n\n## 微積分「任督二脈」邏輯總覽\n- **任脈（微分與基本定理）**：實數建構 $\\to$ [[completeness]] $\\to$ [[nested-interval-theorem]] $\\to$ [[bolzano-weierstrass-theorem]] $\\to$ 均值定理 $\\to$ 微積分基本定理。\n- **督脈（積分存在性）**：[[nested-interval-theorem]] $\\to$ [[heine-borel-theorem]] $\\to$ [[uniform-continuity-theorem]] $\\to$ $\\int_a^b f(x)dx$ 存在。"}, "cantor-set": {"title": "康托爾集 (Cantor Set)", "category": "counterexamples", "tags": ["#counterexample", "#topology", "#set-theory"], "source": "raw/ch03_集合論的公理化.md, raw/ch05_Rn的Topology.md, raw/ch06_賦距空間.md", "summary": "Lebesgue 測度為 0、內集為空且遍稀疏，卻擁有連續統基數 $c$ 的緊緻完備集。", "body": "## 構造方式\n從 $[0, 1]$ 出發，每次從現有閉區間正中央挖去三分之一開區間，取無窮交集 $E = \\bigcap_{n=1}^\\infty F_n$。\n\n## 驚人性質\n1. **測度為 $0$**：挖去的開區間總長度為 $\\sum_{n=1}^\\infty \\frac{2^{n-1}}{3^n} = 1$。\n2. **不可數（基數為 $c$）**：三進位僅含 $0$ 與 $2$ 的序列，與 $[0, 1]$ 等勢。\n3. **緊緻且為完備集 (Perfect Set)**：$E = E'$，無孤立點，且為遍分離集（Totally Disconnected）。"}, "weierstrass-function": {"title": "魏爾斯特拉斯函數 (Weierstrass Function)", "category": "counterexamples", "tags": ["#counterexample", "#real-analysis", "#differentiation"], "source": "raw/ch06_賦距空間.md", "summary": "處處連續卻處處不可微分的經典函數；由 Baire 綱定理可知此類函數在 $C[a,b]$ 中才是絕大多數。", "body": "## 構造方式\n$$f(x) = \\sum_{n=1}^\\infty a^n \\cos(b^n \\pi x) \\quad (0 < a < 1,\\; b \\text{ 為奇整數},\\; ab > 1 + \\frac{3}{2}\\pi)$$\n\n## 核心反例意義\n級數均勻收斂故處處連續，但無窮多尺度震盪使任何點皆無導數。結合 [[baire-category-theorem]] 可證：在 $C[a, b]$ 中可微函數僅為第一類集，處處不可微函數才是第二類集（絕大多數）。"}, "discrete-metric-space": {"title": "離散賦距空間 / 孤獨世界 (Discrete Metric Space)", "category": "counterexamples", "tags": ["#counterexample", "#metric-space", "#topology"], "source": "raw/ch06_賦距空間.md", "summary": "相異兩點距離恆為 1 的賦距空間，雖有界、閉且完備，但無窮離散集絕不緊緻。", "body": "## 構造方式\n$d(x, y) = 1$（$x \\neq y$），$d(x, x) = 0$。\n\n## 核心反例意義\n任意子集皆既開又閉且有界，但單點開球覆蓋 $\\{B_{1/2}(x)\\}$ 無有限子覆蓋，展示一般 [[metric-space]] 中「有界閉集 $\\neq$ 緊緻集」。"}, "infinite-dim-closed-unit-ball": {"title": "無窮維空間中的單位閉球 ($l^2$ 與 $C[0,1]$)", "category": "counterexamples", "tags": ["#counterexample", "#metric-space", "#topology"], "source": "raw/ch05_Rn的Topology.md, raw/ch06_賦距空間.md", "summary": "展示 Heine-Borel 定理在無窮維賦距空間失效：單位閉球有界且閉，卻非緊緻集。", "body": "## 構造方式\n在 $l^2$ 單位閉球中取正交基底列 $e_n = (0, \\dots, 1, 0, \\dots)$。\n\n## 核心反例意義\n任意 $m \\neq n$ 滿足 $\\|e_m - e_n\\|_2 = \\sqrt{2}$，故無任何收斂子列。由 [[compact-iff-sequentially-compact]] 知單位閉球非緊緻。"}, "topologists-sine-curve": {"title": "拓樸學家正弦曲線 (Topologist's Sine Curve)", "category": "counterexamples", "tags": ["#counterexample", "#topology", "#connectedness"], "source": "raw/ch06_賦距空間.md", "summary": "連通但非弧連通的經典幾何圖形，揭示連通性與路徑連通性的細微差異。", "body": "## 構造方式\n$E = \\{(x, 0) \\mid x \\le 0\\} \\cup \\{(x, \\sin(1/x)) \\mid x > 0\\}$。\n\n## 核心反例意義\n兩部分非分離故 $E$ 為 [[connectedness|連通集]]，但 $x \\to 0^+$ 時無窮震盪使任何連續曲線皆無法從右側抵達原點。"}, "non-uniform-continuous-functions": {"title": "非均勻連續函數經典反例集", "category": "counterexamples", "tags": ["#counterexample", "#   <li><strong>[[baire-category-theorem]]</strong>：完備賦距空間中可數個稠密開集的交集仍然稠密，揭示在 $C[a,b]$ 中處處不可微的 [[weierstrass-function]] 才是拓樸上的絕大多數。</li>

function formatWikiText(raw) {
  // Convert markdown-like blocks and [[wikilinks]] into clean HTML
  let html = raw
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[\[([a-z0-9-]+)\]\]/g, (_, slug) => {
      const target = WIKI_DATA[slug];
      const label = target ? target.title.split(' (')[0] : slug;
      return `<a class="wikilink" onclick="openEntry('${slug}')">${label}</a>`;
    });

  // Convert simple lists & paragraphs
  const lines = html.split('\n');
  let out = [];
  let inList = false;
  for (let line of lines) {
    const trimmed = line.trim();
    if (trimmed.startsWith('- ') || /^\d+\. /.test(trimmed)) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push('<li>' + trimmed.replace(/^(- |\d+\. )/, '') + '</li>');
    } else {
      if (inList) { out.push('</ul>'); inList = false; }
      if (trimmed.startsWith('<h2>')) out.push(trimmed);
      else if (trimmed.length > 0) out.push('<p>' + trimmed + '</p>');
    }
  }
  if (inList) out.push('</ul>');
  return out.join('\n');
}

      ],
      throwOnError: false
    });
  }
}

    const entries = Object.entries(WIKI_DATA).filter(([slug, item]) =>
      item.category === cat &&
      (item.title.toLowerCase().includes(q) || item.summary.toLowerCase().includes(q) || slug.includes(q))
    );
    if (entries.length === 0) continue;

    const groupDiv = document.createElement('div');
    groupDiv.className = 'nav-group';
    groupDiv.innerHTML = `<div class="nav-group-title">${label} (${entries.length})</div>`;
    entries.forEach(([slug, item]) => {
      const btn = document.createElement('button');
      btn.className = 'nav-item';
      btn.id = 'nav-' + slug;
      btn.textContent = item.title.split(' (')[0];
      btn.onclick = () => openEntry(slug);
      groupDiv.appendChild(btn);
    });
    container.appendChild(groupDiv);
  }
}

function setActiveNav(id) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function showIndex() {
  switchMode('wiki', false);
  setActiveNav('nav-index');
  const pane = document.getElementById('reader-pane');
  let cardsHtml = '';
  for (const [slug, item] of Object.entries(WIKI_DATA)) {
    cardsHtml += `
      <div class="card" onclick="openEntry('${slug}')">
        <div class="card-cat">${CATEGORY_LABELS[item.category].split(' (')[0]}</div>
        <div class="card-title">${item.title}</div>
        <div class="card-desc">${item.summary}</div>
      </div>`;
  }
  pane.innerHTML = `
    <h1>高等微積分知識地圖 (Adv-Calc Wiki)</h1>
    <div class="summary-callout">
      本知識庫共收錄 <strong>31 篇</strong> 原子化數學條目，所有定義、定理、反例與證明技巧皆透過雙向連結相互參照。點擊下方任意卡片或左側目錄即可檢視嚴格定義與推導。
    </div>
    <div class="overview-grid">${cardsHtml}</div>
  `;
  renderMath(pane);
}

function openEntry(slug) {
  switchMode('wiki', false);
  setActiveNav('nav-' + slug);
  const item = WIKI_DATA[slug];
  if (!item) return;
  const pane = document.getElementById('reader-pane');
  const tagsHtml = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
  pane.innerHTML = `
    <div class="article-meta">
      ${tagsHtml}
      <span>來源：<code>${item.source}</code></span>
    </div>
    <h1>${item.title}</h1>
    <div class="summary-callout">${item.summary}</div>
    <div class="wiki-body">${formatWikiText(item.body)}</div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderMath(pane);
}

function showNote() {
  switchMode('notes', false);
  setActiveNav('nav-note');
  const pane = document.getElementById('reader-pane');
  const tagsHtml = RESEARCH_NOTE.tags.map(t => `<span class="tag">${t}</span>`).join('');
  const linkedBody = RESEARCH_NOTE.body.replace(/\[\[([a-z0-9-]+)\]\]/g, (_, slug) => {
    const target = WIKI_DATA[slug];
    const label = target ? target.title.split(' (')[0] : slug;
    return `<a class="wikilink" onclick="openEntry('${slug}')">${label}</a>`;
  });
  pane.innerHTML = `
    <div class="article-meta">
      ${tagsHtml}
      <span>檔案：<code>${RESEARCH_NOTE.source}</code></span>
    </div>
    <h1>${RESEARCH_NOTE.title}</h1>
    <div class="summary-callout">${RESEARCH_NOTE.summary}</div>
    <div class="wiki-body">${linkedBody}</div>
  `;
  renderMath(pane);
}

function renderSlide() {
  const s = SLIDES[currentSlide];
  const stage = document.getElementById('slide-stage');
  stage.innerHTML = `
    <div class="slide-kicker">${s.kicker}</div>
    <h2>${s.title}</h2>
    <div>${s.html}</div>
  `;
  document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${SLIDES.length}`;
  renderMath(stage);
}

function nextSlide() {
  if (currentSlide < SLIDES.length - 1) { currentSlide++; renderSlide(); }
}
function prevSlide() {
  if (currentSlide > 0) { currentSlide--; renderSlide(); }
}

function switchMode(mode, triggerRender = true) {
  document.querySelectorAll('nav.mode-switch button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + mode).classList.add('active');

  const wikiWs = document.getElementById('wiki-workspace');
  const slidesWs = document.getElementById('slides-workspace');

  if (mode === 'slides') {
    wikiWs.style.display = 'none';
    slidesWs.classList.add('active');
    renderSlide();
  } else {
    slidesWs.classList.remove('active');
    wikiWs.style.display = 'grid';
    if (triggerRender) {
      if (mode === 'notes') showNote();
      else showIndex();
    }
  }
}

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('slides-workspace').classList.contains('active')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
});

window.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  showIndex();
});
</script>
</body>
</html>
